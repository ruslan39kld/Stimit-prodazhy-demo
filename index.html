        0% {

        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          transform: translateX(100%);
          opacity: 0;
        }
      }

        0%,

          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.35);
        }
        50% {
          transform: scale(1.03);

        }
      }

        0% {

        }
        100% {
          background-color: rgba(255, 255, 255, 1);
          border-color: rgba(226, 232, 240, 1);
        }
      }

      @keyframes profileResetFlash {
        0% {
          background-color: rgba(254, 243, 199, 0.95);
          border-color: rgba(217, 119, 6, 0.65);
        }
        100% {
          background-color: rgba(255, 255, 255, 1);
          border-color: rgba(226, 232, 240, 1);
        }
      }

      .animate-signal-travel {
        animation: signalTravel 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .animate-node-pulse {
        animation: nodePulse 1.8s ease-in-out infinite;
      }

      .animate-field-highlight {
        animation: fieldHighlight 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-profile-reset {
        animation: profileResetFlash 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

        .animate-signal-travel,
        .animate-node-pulse,
        .animate-field-highlight,
        .animate-profile-reset {
          animation: none !important;
        }
      }

        var state = {
          viewMode: 'landing', // 'landing' | 'workspace' | 'summary'
          activeScenarioId: 'ai-project',
          currentStepNumber: 1,
          messages: [],
          currentTurn: null,
          lastTurnStep: 1,
          exploredOptionKeys: [],
          triggeredAgents: [],
          changedFields: [],
          isProfileReset: false,
          updateTick: 0,
          isTyping: false,
          pipelineStage: -1,
          isMissionComplete: false,
          finalOption: null,
          showOnboardingHint: true,
          isDetailsModalOpen: false,
          modalViewMode: 'structured', // 'structured' | 'json'
          mobileTab: 'dialogue', // 'dialogue' | 'agents'
          agentUpdatedBadge: false,
          inputText: '',
        };

        var pendingTimers = [];
        var summaryAnimFrame = null;
        var summaryRevealInterval = null;

        function clearPendingTimers() {
          for (var i = 0; i < pendingTimers.length; i++) {
            window.clearTimeout(pendingTimers[i]);
          }
          pendingTimers = [];
        }

        function clearSummaryAnimations() {
          if (summaryAnimFrame !== null) {
            cancelAnimationFrame(summaryAnimFrame);
            summaryAnimFrame = null;
          }
          if (summaryRevealInterval !== null) {
            clearInterval(summaryRevealInterval);
            summaryRevealInterval = null;
          }
        }

        function getActiveScenario() {
          for (var i = 0; i < SCENARIOS.length; i++) {
            if (SCENARIOS[i].id === state.activeScenarioId) return SCENARIOS[i];
          }
          return SCENARIOS[0];
        }

        function computeChangedFields(prevTurn, nextTurn, initialProfile) {
          var prevProfile = prevTurn ? prevTurn.reasoning.profile : initialProfile;
          var nextProfile = nextTurn.reasoning.profile;
          var changed = [];

          if (!prevTurn || prevTurn.reasoning.goals.main_goal !== nextTurn.reasoning.goals.main_goal) {
            changed.push('main_goal');
          }

          var keys = Object.keys(nextProfile);
          for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            if (prevProfile[key] !== nextProfile[key]) {
              changed.push(key);
            }
          }
          return changed;
        }

        function startScenario(scenarioId) {
          clearPendingTimers();
          clearSummaryAnimations();

          var target = SCENARIOS[0];
          for (var i = 0; i < SCENARIOS.length; i++) {
            if (SCENARIOS[i].id === scenarioId) {
              target = SCENARIOS[i];
              break;
            }
          }

          state.activeScenarioId = target.id;
          state.currentStepNumber = 1;
          state.messages = [
            {
              id: 'opening-' + target.id + '-' + Date.now(),
              sender: 'system',
              text: target.openingMessage,
              timestamp: formatTime(),
            },
          ];
          state.currentTurn = null;
          state.lastTurnStep = 1;
          state.exploredOptionKeys = [];
          state.triggeredAgents = [];
          state.changedFields = [];
          state.isProfileReset = false;
          state.updateTick = 0;
          state.isTyping = false;
          state.pipelineStage = -1;
          state.isMissionComplete = false;
          state.finalOption = null;
          state.isDetailsModalOpen = false;
          state.modalViewMode = 'structured';
          state.mobileTab = 'dialogue';
          state.agentUpdatedBadge = false;
          state.inputText = '';
          state.viewMode = 'workspace';

          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleChooseOption(optionId) {
          if (state.isTyping || state.isMissionComplete) return;
          var scenario = getActiveScenario();
          var stepData = null;
          for (var s = 0; s < scenario.steps.length; s++) {
            if (scenario.steps[s].stepNumber === state.currentStepNumber) {
              stepData = scenario.steps[s];
              break;
            }
          }
          if (!stepData) stepData = scenario.steps[0];

          var option = null;
          for (var o = 0; o < stepData.options.length; o++) {
            if (stepData.options[o].id === optionId) {
              option = stepData.options[o];
              break;
            }
          }
          if (!option) return;

          clearPendingTimers();
          state.showOnboardingHint = false;

          state.messages.push({
            id: 'client-' + Date.now(),
            sender: 'client',
            text: option.text,
            timestamp: formatTime(),
            stepNumber: state.currentStepNumber,
          });
          state.isTyping = true;
          state.pipelineStage = 0;
          render();
          scrollChatToBottom();

          var stageDelays = [160, 320, 480, 640, 820];
          stageDelays.forEach(function (delay, idx) {
            var t = window.setTimeout(function () {
              if (idx < 4) {
                state.pipelineStage = idx + 1;
                renderPipelineOnly();
              } else {
                var prevTurn = state.currentTurn;
                var nextTurn = option.turn;
                var diff = computeChangedFields(prevTurn, nextTurn, scenario.initialProfile);

                var agentKeys = Object.keys(nextTurn.reasoning.expert_agents);
                for (var ak = 0; ak < agentKeys.length; ak++) {
                  var key = agentKeys[ak];
                  if (
                    nextTurn.reasoning.expert_agents[key].used &&
                    state.triggeredAgents.indexOf(key) === -1
                  ) {
                    state.triggeredAgents.push(key);
                  }
                }

                state.currentTurn = nextTurn;
                state.lastTurnStep = state.currentStepNumber;
                state.changedFields = diff;
                state.isProfileReset = Boolean(option.isProfileReset);
                state.updateTick += 1;
                state.pipelineStage = 5;
                state.isTyping = false;
                state.agentUpdatedBadge = true;

                state.messages.push({
                  id: 'sys-' + Date.now(),
                  sender: 'system',
                  text: nextTurn.answer,
                  timestamp: formatTime(),
                  turnOutput: nextTurn,
                  isProfileReset: option.isProfileReset,
                  stepNumber: state.currentStepNumber,
                });

                if (option.isFinalChoice) {
                  state.isMissionComplete = true;
                  state.finalOption = option;
                  render();
                  scrollChatToBottom();

                  var summaryTimer = window.setTimeout(function () {
                    state.viewMode = 'summary';
                    render();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                  }, 1150);
                  pendingTimers.push(summaryTimer);
                } else if (option.advancesStep) {
                  state.currentStepNumber = Math.min(
                    scenario.totalSteps,
                    state.currentStepNumber + 1
                  );
                  render();
                  scrollChatToBottom();
                } else {
                  var optionKey = state.currentStepNumber + '-' + option.id;
                  if (state.exploredOptionKeys.indexOf(optionKey) === -1) {
                    state.exploredOptionKeys.push(optionKey);
                  }
                  render();
                  scrollChatToBottom();
                }
              }
            }, delay);
            pendingTimers.push(t);
          });
        }

        function handleSendFreeText(text) {
          var trimmed = text.trim();
          if (!trimmed || state.isTyping) return;

          clearPendingTimers();
          state.showOnboardingHint = false;
          state.inputText = '';

          state.messages.push({
            id: 'client-free-' + Date.now(),
            sender: 'client',
            text: trimmed,
            timestamp: formatTime(),
          });
          state.isTyping = true;
          render();
          scrollChatToBottom();

          var t = window.setTimeout(function () {
            state.isTyping = false;
            state.messages.push({
              id: 'guard-' + Date.now(),
              sender: 'system',
              text: 'Это демо-стенд: здесь показан заранее записанный сценарий работы системы. Вы можете продолжить текущий диалог кнопками ниже или переключиться на любой из трёх примеров:',
              timestamp: formatTime(),
              isDemoGuard: true,
            });
            render();
            scrollChatToBottom();
          }, 450);

          pendingTimers.push(t);
        }

        function scrollChatToBottom() {
          window.requestAnimationFrame(function () {
            var el = document.getElementById('chat-bottom');
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
          });
        }

          for (var i = 0; i < keys.length; i++) {
            var k = keys[i];

          return names.join(' + ');

            var isCompleted = activeStage > idx;
            var isActive = activeStage === idx;
            var displayLabel =
              stage.id === 'experts' && selectedLabel && (isActive || isCompleted)
                ? selectedLabel
                : stage.label;

            var cls = isActive
              ? 'bg-[#1B3A6B] text-white border-[#1B3A6B] animate-node-pulse'
              : isCompleted
              ? 'bg-emerald-50 text-emerald-800 border-emerald-200'

              ? icon('check', 'w-3.5 h-3.5 text-emerald-700 shrink-0')

            .map(function (other) {
              return (
                '<div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm hover:border-[#1B3A6B]/40 transition-all flex flex-col justify-between gap-4">' +
                '<div>' +
                '<div class="text-xs font-medium text-slate-500">' +
                escapeHtml(other.category) +
                ' · ' +
                escapeHtml(other.clientRole) +
                '</div>' +
                '<h4 class="mt-1.5 font-display text-lg font-bold text-slate-900">' +
                escapeHtml(other.title) +
                '</h4>' +
                '<p class="mt-1.5 text-sm text-slate-600 leading-relaxed">' +
                escapeHtml(other.description) +
                '</p>' +
                '</div>' +
                '<button type="button" data-select-scenario="' +
                other.id +
                '" class="self-start inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#1B3A6B] text-white text-sm font-semibold hover:bg-[#142D54] transition-colors cursor-pointer">' +
                '<span>Запустить сценарий</span>' +
                icon('arrowRight', 'w-4 h-4') +
                '</button>' +
                '</div>'
              );
            })
            .join('');

          return {
            targetProbability: targetProbability,
            totalTakeaways: visibleTakeaways.length,
            html:
              '<div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10 space-y-8">' +
              '<div class="rounded-2xl text-white p-6 sm:p-8 shadow-lg" style="background: linear-gradient(150deg, #1B3A6B 0%, #102548 100%);">' +
              '<div class="flex flex-col md:flex-row md:items-center justify-between gap-6">' +
              '<div class="space-y-2.5 max-w-2xl">' +
              '<div class="text-xs font-medium text-blue-200">Итог миссии · ' +
              escapeHtml(scenario.title) +
              ' · ' +
              escapeHtml(statusLabel) +
              '</div>' +
              '<h2 class="font-display text-2xl sm:text-3xl font-bold leading-tight text-balance">' +
              escapeHtml(outcomeText) +
              '</h2>' +
              '<p class="text-sm sm:text-base text-blue-100/90 pt-1"><span class="font-semibold text-white">Следующий шаг:</span> ' +
              escapeHtml(nextStepText) +
              '</p>' +
              '</div>' +
              '<div class="bg-white/10 border border-white/20 rounded-2xl px-6 py-5 text-center shrink-0 min-w-[180px]">' +
              '<div class="text-xs font-medium text-blue-100">Итоговая вероятность</div>' +
              '<div id="summary-pct-text" class="mt-1 font-mono-data text-4xl sm:text-5xl font-bold text-white">0%</div>' +
              '<div class="mt-2 h-1.5 w-full rounded-full bg-white/20 overflow-hidden">' +
              '<div id="summary-pct-bar" class="h-full rounded-full bg-sky-300 transition-all duration-300" style="width:0%"></div>' +
              '</div>' +
              '</div>' +
              '</div>' +
              '<div class="mt-6 pt-5 border-t border-white/15 flex flex-wrap items-center gap-3">' +
              '<button type="button" data-back-to-chat="true" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white text-[#1B3A6B] text-sm font-semibold hover:bg-blue-50 transition-colors cursor-pointer">' +
              icon('messageSquare', 'w-4 h-4') +
              '<span>Вернуться к переписке и JSON</span>' +
              '</button>' +
              '<button type="button" data-replay-scenario="true" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white/10 border border-white/25 text-white text-sm font-semibold hover:bg-white/20 transition-colors cursor-pointer">' +
              icon('rotateCcw', 'w-4 h-4') +
              '<span>Пройти сценарий заново</span>' +
              '</button>' +
              '</div>' +
              '</div>' +
              '<section class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-7 shadow-sm">' +
              '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-100">' +
              '<div>' +
              '<h3 class="font-display text-lg sm:text-xl font-bold text-slate-900">Участвовавшие агенты и их вклад</h3>' +
              '<p id="summary-revealed-count" class="text-xs sm:text-sm text-slate-500 mt-0.5">Выводы раскрываются по очереди (0 из ' +
              visibleTakeaways.length +
              ')</p>' +
              '</div>' +
              '</div>' +
              '<div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-3.5">' +
              takeawaysHtml +
              '</div>' +
              '</section>' +
              '<section class="space-y-4">' +
              '<h3 class="font-display text-lg sm:text-xl font-bold text-slate-900">Проверьте тот же движок на других темах</h3>' +
              '<div class="grid grid-cols-1 md:grid-cols-2 gap-5">' +
              otherScenariosHtml +
              '</div>' +
              '</section>' +
              '</div>',
          };
        }

        function startSummaryAnimations(targetProbability, totalTakeaways) {
          clearSummaryAnimations();
          var prefersReducedMotion =
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          function setCounter(val) {
            var txt = document.getElementById('summary-pct-text');
            var bar = document.getElementById('summary-pct-bar');
            if (txt) txt.textContent = val + '%';
            if (bar) bar.style.width = val + '%';
          }

          function revealUpTo(count) {
            var label = document.getElementById('summary-revealed-count');
            if (label) {
              label.textContent =
                'Выводы раскрываются по очереди (' + count + ' из ' + totalTakeaways + ')';
            }
            for (var i = 0; i < count; i++) {
              var card = document.querySelector('[data-takeaway-idx="' + i + '"]');
              if (card) {
                card.classList.remove('opacity-0', 'translate-y-2', 'bg-slate-50');
                card.classList.add('opacity-100', 'translate-y-0', 'bg-white');
              }
            }
          }

          if (prefersReducedMotion) {
            setCounter(targetProbability);
            revealUpTo(totalTakeaways);
            return;
          }

          var duration = 1100;
          var startTime = performance.now();

          function tick(now) {
            var elapsed = now - startTime;
            var progress = Math.min(1, elapsed / duration);
            var eased = 1 - Math.pow(1 - progress, 3);
            setCounter(Math.round(eased * targetProbability));
            if (progress < 1) {
              summaryAnimFrame = requestAnimationFrame(tick);
            } else {
              summaryAnimFrame = null;
            }
          }
          summaryAnimFrame = requestAnimationFrame(tick);

          var revealed = 0;
          summaryRevealInterval = window.setInterval(function () {
            revealed += 1;
            revealUpTo(revealed);
            if (revealed >= totalTakeaways) {
              clearInterval(summaryRevealInterval);
              summaryRevealInterval = null;
            }
          }, 180);
        }

        function renderWorkspace() {
          var scenario = getActiveScenario();
          var progressPct = state.isMissionComplete
            ? 100
            : Math.round(((state.currentStepNumber - 1) / scenario.totalSteps) * 100);

          var desktopSwitchersHtml = SCENARIOS.map(function (sc) {
            var active = sc.id === scenario.id;
            return (
              '<button type="button" data-select-scenario="' +
              sc.id +
              '" class="px-3 py-1.5 rounded-md text-xs font-medium transition-colors cursor-pointer whitespace-nowrap ' +
              (active ? 'bg-white text-[#1B3A6B] font-semibold' : 'text-blue-100 hover:text-white') +
              '">' +
              escapeHtml(sc.shortTitle) +
              '</button>'
            );
          }).join('');

          var pipelineBarHtml =
            state.viewMode === 'workspace'
              ? '<div class="bg-white border-b border-slate-200">' +
                '<div class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5">' +
                '<div id="live-pipeline-track" class="flex items-center gap-2 overflow-x-auto no-scrollbar">' +
                renderLivePipelineInner() +
                '</div>' +
                '</div>' +
                '</div>'
              : '';

          var mainHtml = '';
          var summaryMeta = null;

          if (state.viewMode === 'summary') {
            summaryMeta = renderMissionSummary(scenario);
            mainHtml = '<main class="flex-1">' + summaryMeta.html + '</main>';
          } else {
            var mobileSwitchersHtml = SCENARIOS.map(function (sc) {
              var active = sc.id === scenario.id;
              return (
                '<button type="button" data-select-scenario="' +
                sc.id +
                '" class="px-3 py-1.5 rounded-lg text-xs font-semibold border whitespace-nowrap shrink-0 cursor-pointer ' +
                (active
                  ? 'bg-[#1B3A6B] text-white border-[#1B3A6B]'
                  : 'bg-white text-slate-700 border-slate-200') +
                '">' +
                escapeHtml(sc.shortTitle) +
                '</button>'
              );
            }).join('');

            var badgeHtml =
              state.agentUpdatedBadge && state.mobileTab !== 'agents'
                ? '<span class="text-[11px] font-bold text-[#1B3A6B]">· обн.</span>'
                : '';

            mainHtml =
              '<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-4 sm:py-6 flex flex-col gap-4">' +
              '<div class="lg:hidden space-y-2.5">' +
              '<div class="flex items-center gap-1.5 overflow-x-auto pb-1">' +
              mobileSwitchersHtml +
              '</div>' +
              '<div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-200/80">' +
              '<button type="button" data-mobile-tab="dialogue" class="py-2.5 px-3 rounded-lg text-sm font-semibold inline-flex items-center justify-center gap-2 transition-colors cursor-pointer ' +
              (state.mobileTab === 'dialogue' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600') +
              '">' +
              icon('messageSquare', 'w-4 h-4') +
              '<span>Диалог</span>' +
              '</button>' +
              '<button type="button" data-mobile-tab="agents" class="py-2.5 px-3 rounded-lg text-sm font-semibold inline-flex items-center justify-center gap-2 transition-colors cursor-pointer ' +
              (state.mobileTab === 'agents' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600') +
              '">' +
              icon('bot', 'w-4 h-4') +
              '<span>Агенты</span>' +
              badgeHtml +
              '</button>' +
              '</div>' +
              '</div>' +
              '<div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">' +
              '<div class="lg:col-span-7 flex flex-col ' +
              (state.mobileTab === 'dialogue' ? 'block' : 'hidden lg:flex') +
              '">' +
              renderDialoguePanel(scenario) +
              '</div>' +
              '<div class="lg:col-span-5 flex flex-col ' +
              (state.mobileTab === 'agents' ? 'block' : 'hidden lg:flex') +
              '">' +
              renderAgentPanel(scenario) +
              '</div>' +
              '</div>' +
              '</main>';
          }

          return {
            summaryMeta: summaryMeta,
            html:
              '<div class="min-h-screen flex flex-col bg-slate-50">' +
              '<header class="bg-[#162F58] text-white border-b border-white/10">' +
              '<div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-4">' +
              '<div class="flex items-center gap-3 min-w-0">' +
              '<button type="button" data-go-landing="true" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium text-blue-100 hover:text-white transition-colors cursor-pointer whitespace-nowrap shrink-0">' +
              icon('arrowLeft', 'w-4 h-4') +
              '<span class="hidden sm:inline">На главную</span>' +
              '</button>' +
              '<span aria-hidden="true" class="text-white/25 hidden sm:inline">|</span>' +
              '<span class="font-display font-bold text-sm sm:text-base text-white truncate">' +
              escapeHtml(scenario.title) +
              '</span>' +
              '</div>' +
              '<div class="hidden lg:flex items-center gap-1 bg-white/10 p-1 rounded-lg">' +
              desktopSwitchersHtml +
              '</div>' +
              '<div class="flex items-center gap-3 shrink-0">' +
              '<div class="flex items-center gap-2.5">' +
              '<span class="font-mono-data text-xs sm:text-sm font-semibold text-white whitespace-nowrap">Шаг ' +
              state.currentStepNumber +
              ' из ' +
              scenario.totalSteps +
              '</span>' +
              '<div class="hidden sm:block w-20 h-1.5 rounded-full bg-white/20 overflow-hidden">' +
              '<div class="h-full rounded-full bg-sky-300 transition-all duration-300" style="width:' +
              Math.max(15, progressPct) +
              '%"></div>' +
              '</div>' +
              '</div>' +
              '<button type="button" data-replay-scenario="true" title="Начать сценарий заново" aria-label="Начать сценарий заново" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors cursor-pointer shrink-0">' +
              icon('rotateCcw', 'w-4 h-4') +
              '</button>' +
              '</div>' +
              '</div>' +
              '</header>' +
              pipelineBarHtml +
              mainHtml +
              renderReasoningModal() +
              '</div>',
          };
        }

        // =========================================================================
        // 5. MAIN RENDER & EVENT DELEGATION
        // =========================================================================
        var root = document.getElementById('app');

        function render() {
          if (state.viewMode === 'landing') {
            clearSummaryAnimations();
            root.innerHTML = renderHeroSection();
            return;
          }

          var res = renderWorkspace();
          root.innerHTML = res.html;

          if (state.viewMode === 'summary' && res.summaryMeta) {
            startSummaryAnimations(
              res.summaryMeta.targetProbability,
              res.summaryMeta.totalTakeaways
            );
          } else {
            clearSummaryAnimations();
          }

          bindFormListeners();
        }

        function bindFormListeners() {
          var form = document.getElementById('free-text-form');
          var input = document.getElementById('free-text-input');
          var submitBtn = document.getElementById('free-text-submit');

          if (input && submitBtn) {
            input.addEventListener('input', function (e) {
              state.inputText = e.target.value;
              submitBtn.disabled = state.isTyping || !state.inputText.trim();
            });
          }

          if (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              handleSendFreeText(state.inputText);
            });
          }
        }

        root.addEventListener('click', function (e) {
          var target = e.target;
          if (!target || !target.closest) return;

          var scenarioBtn = target.closest('[data-select-scenario]');
          if (scenarioBtn) {
            startScenario(scenarioBtn.getAttribute('data-select-scenario'));
            return;
          }

          var optionBtn = target.closest('[data-choose-option]');
          if (optionBtn) {
            handleChooseOption(optionBtn.getAttribute('data-choose-option'));
            return;
          }

          if (target.closest('[data-dismiss-hint]')) {
            state.showOnboardingHint = false;
            render();
            return;
          }

          if (target.closest('[data-open-summary]')) {
            state.viewMode = 'summary';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (target.closest('[data-back-to-chat]')) {
            clearSummaryAnimations();
            state.viewMode = 'workspace';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          if (target.closest('[data-replay-scenario]')) {
            startScenario(state.activeScenarioId);
            return;
          }

          if (target.closest('[data-go-landing]')) {
            clearPendingTimers();
            clearSummaryAnimations();
            state.viewMode = 'landing';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }

          var mobileTabBtn = target.closest('[data-mobile-tab]');
          if (mobileTabBtn) {
            var nextTab = mobileTabBtn.getAttribute('data-mobile-tab');
            state.mobileTab = nextTab;
            if (nextTab === 'agents') {
              state.agentUpdatedBadge = false;
            }
            render();
            return;
          }

          if (target.closest('[data-open-details]')) {
            if (state.currentTurn) {
              state.isDetailsModalOpen = true;
              render();
            }
            return;
          }

          if (target.closest('[data-close-details]')) {
            state.isDetailsModalOpen = false;
            render();
            return;
          }

          var modalModeBtn = target.closest('[data-modal-mode]');
          if (modalModeBtn) {
            state.modalViewMode = modalModeBtn.getAttribute('data-modal-mode');
            render();
            return;
          }

          if (target.closest('#copy-json-btn')) {
            var copyBtn = target.closest('#copy-json-btn');
            if (navigator.clipboard && state.currentTurn) {
              navigator.clipboard
                .writeText(JSON.stringify(state.currentTurn, null, 2))
                .then(function () {
                  copyBtn.innerHTML =
                    icon('check', 'w-3.5 h-3.5 text-emerald-700') + '<span>Скопировано</span>';
                  window.setTimeout(function () {
                    if (document.body.contains(copyBtn)) {
                      copyBtn.innerHTML =
                        icon('copy', 'w-3.5 h-3.5') + '<span>Копировать JSON</span>';
                    }
                  }, 1800);
                })
                .catch(function () {});
            }
            return;
          }

          if (target.id === 'reasoning-modal-backdrop') {
            state.isDetailsModalOpen = false;
            render();
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && state.isDetailsModalOpen) {
            state.isDetailsModalOpen = false;
            render();
          }
        });

        // Initial render
        render();
      })();
    </script>
  </body>
</html>
